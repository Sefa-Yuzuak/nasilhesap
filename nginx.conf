server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # TLS kenar katmanda (Traefik) sonlanıyor; nginx isteği http olarak görür ve
    # mutlak Location kurunca şemayı http'ye düşürür → gereksiz 301→302 zinciri.
    # Göreli Location şemayı korur.
    absolute_redirect off;
    port_in_redirect off;

    # www ve apex aynı içeriği 200 ile veriyordu: her URL iki ayrı ana bilgisayarda
    # erişilebilir oluyor ve Google bunu "alternatif sayfa" olarak raporluyor.
    # Kanonik apex; www kalıcı olarak apex'e yönlensin.
    if ($host ~* ^www\.(?<apex>.+)$) {
        return 301 https://$apex$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/manifest+json;

    # NGINX TUZAĞI — CANLIDA ÖLÇÜLDÜ: add_header yalnızca alt blokta HİÇ add_header
    # yoksa miras alınır. Bu yüzden başlıklar add_header kullanan her location'da
    # tekrarlanıyor; tek yerde yazmak /static/* yolunda sessizce başlıksız kalmak
    # demekti. Ayrıca X-Frame-Options ile HSTS hiç yoktu, eklendi.
    #
    # http -> https yönlendirmesini kenar katmandaki Traefik yapıyor ve 302 döndürüyor;
    # oraya müdahale edemiyoruz. HSTS ile tarayıcı sonraki ziyaretlerde doğrudan https
    # ister, yani geçici yönlendirme hiç kurulmaz.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Oran ve araç verisi günlük değişebiliyor: bir saatten uzun tutulmuyor.
    # `expires` kendi Cache-Control'ünü ekliyor, add_header ile birlikte iki başlık
    # çıkıyordu; tek başlıkta toplandı.
    location ~* ^/static/(oranlar|araclar)\.json$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    location /static/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-store";
    }
}
