server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # TLS kenar katmanda (Traefik) sonlanıyor; nginx isteği http olarak görür ve
    # mutlak Location kurunca şemayı http'ye düşürür → gereksiz 301→302 zinciri.
    # Göreli Location şemayı korur.
    absolute_redirect off;
    port_in_redirect off;

    # www ve apex aynı içeriği 200 ile veriyordu: her URL iki ayrı ana bilgisayarda
    # erişilebilir oluyor ve Google bunu "alternatif sayfa" olarak raporluyor.
    # Kanonik apex; www kalıcı olarak apex'e yönlensin.
    if ($host ~* ^www\.(?<apex>.+)$) {
        return 301 https://$apex$request_uri;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location = /static/oranlar.json { expires 1h; }
    location = /static/araclar.json { expires 1h; }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
    error_page 404 /404.html;
}
