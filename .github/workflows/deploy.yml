name: Coolify deploy

# Push + her gün 03:00 UTC (06:00 TR) yeniden derleme (oran/tarih tazeliği).
# Coolify manual webhook deploy tetiklemez; deploy API'si force=true ile çağrılır.
# Secret'lar: COOLIFY_DEPLOY_URL (https://coolify.polyazilim.com/api/v1/deploy?uuid=...), COOLIFY_TOKEN

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Coolify deploy API'sini çağır
        env:
          DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$TOKEN" ]; then
            echo "::warning::COOLIFY_DEPLOY_URL / COOLIFY_TOKEN secret'ı henüz yok — deploy atlandı."; exit 0
          fi
          case "$DEPLOY_URL" in
            *force=*) URL="$DEPLOY_URL" ;;
            *\?*)     URL="$DEPLOY_URL&force=true" ;;
            *)        URL="$DEPLOY_URL?force=true" ;;
          esac
          # Sunucuya ulasilamamasi gecici olabiliyor: 09.09.2026'da GitHub Actions
          # 133 saniye boyunca baglanamadi (curl 28), is akisi basarisiz oldu ve
          # site sessizce eski surumde kaldi. Uc deneme, aralarinda 20 saniye.
          code="000"
          for deneme in 1 2 3; do
            echo "POST (force=true) — deneme $deneme..."
            code=$(curl -sS --connect-timeout 20 --max-time 90 -o /tmp/y.txt -w "%{http_code}" -X POST "$URL" -H "Authorization: Bearer $TOKEN") || code="000"
            echo "HTTP $code"; cat /tmp/y.txt; echo ""
            case "$code" in 2*) break ;; esac
            if [ "$deneme" -lt 3 ]; then sleep 20; fi
          done
          case "$code" in
            2*) echo "Deploy tetiklendi" ;;
            401) echo "::error::401 - token geçersiz."; exit 1 ;;
            *)  echo "::error::Beklenmeyen yanıt (HTTP $code)"; exit 1 ;;
          esac
